[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-lens"
version = "0.1.0"
description = "LP Lens: private markets fund performance analytics - synthetic fund data -> Snowflake -> dbt marts -> Power BI semantic model + Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tushar Kaushik" }]

# Core: imported directly by src/lp_lens. Metric math lives here, so these are not optional --
# the dbt marts and the dashboards both have to agree with this code, and the reconciliation
# tests compare them.
dependencies = [
    "numpy>=1.26",            # numeric base
    "pandas>=2.2",            # dataframes for the generator and the query layer
    "pyarrow>=16.0",          # Parquet read/write for data/raw
    "scipy>=1.12",            # Brent fallback for the IRR solver when Newton fails to converge
    "pydantic>=2.5,<3",       # typed generator config
    "pyyaml>=6.0",            # reads the generator config and the dbt YAML docs
    "duckdb>=1.1,<2",         # local warehouse engine, and the query layer's default source
]

[project.optional-dependencies]
# SQL transformation layer. Both adapters are listed together because every model must build
# on DuckDB and Snowflake alike -- installing only one makes it impossible to prove that.
# dbt-snowflake brings snowflake-connector-python transitively, which is what infra/snowflake/
# needs to run.
warehouse = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9,<2",
    "dbt-snowflake>=1.10,<2",
]
# Web dashboard. Reads the marts only; it holds no business logic.
app = [
    "streamlit>=1.40",
    "plotly>=6.0,<8",
    "snowflake-connector-python>=3.12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "sqlfluff>=4.0,<5",
    # Must track the sqlfluff version; the templater ships in lockstep with the linter.
    "sqlfluff-templater-dbt>=4.0,<5",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets same-named test files coexist across directories without __init__.py.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "app"]

# Selected explicitly rather than inherited, so a ruff upgrade cannot silently change what CI
# enforces. E402 matters here: the infra/snowflake scripts adjust sys.path before importing a
# sibling module, and that needs to be a deliberate, annotated exception rather than an
# unnoticed one. Import sorting (I) is deliberately left off for the same reason -- it would
# reorder those imports back above the sys.path call and break them.
[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF"]
