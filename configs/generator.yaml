# Synthetic private markets data generator.
#
# All data produced from this file is fabricated. No manager, fund or investor named in the output
# is a real entity, and no figure in it is a real reported number. See
# src/lp_lens/generate/README.md for the entity definitions and the outcome model.
#
# One seed drives every draw. Same seed plus same config gives byte-identical Parquet; change the
# seed and every table changes.
seed: 20260630

# Nothing is generated after this date. Funds whose life extends past it are still active and are
# truncated here rather than being run to liquidation.
as_of_date: 2026-06-30

managers:
  count: 25
  hq_regions: [North America, Europe, Asia-Pacific, Middle East]
  founded_year_range: [1985, 2015]

funds:
  count: 60
  vintage_year_range: [2012, 2024]
  # Share of funds denominated in EUR; the rest are USD.
  eur_share: 0.30
  geography_focus: [North America, Europe, Asia-Pacific, Global, Emerging Markets]
  size_range_musd: [150.0, 4000.0]

  # Terminal TVPI at liquidation is drawn as exp(Normal(tvpi_log_mean, tvpi_log_sd)), so
  # exp(tvpi_log_mean) is the median multiple and tvpi_log_sd sets the dispersion.
  #
  # These are invented assumptions chosen to give the synthetic book a usable shape. They are not
  # calibrated to, and make no claim about, any real fund, index or industry data set.
  #
  # Two properties are deliberate and are asserted in tests/test_generator.py:
  #
  #   1. Every strategy is centred above 1.0x. A strategy centred at break-even would make its
  #      whole cohort indistinguishable from a fund that had merely returned capital, which leaves
  #      the downstream metrics nothing to separate.
  #   2. Dispersion is ordered, widest to narrowest:
  #        Venture 0.72 > Growth 0.45 > Buyout 0.34 > Real Estate 0.28
  #                > Secondaries 0.18 > Infrastructure 0.16 > Private Credit 0.14
  #      Venture's 0.72 opens a wide fan, putting a real loss-making tail and a real 4x-plus tail
  #      in the same cohort. Private credit and infrastructure are the tight ones: at 0.14 and
  #      0.16 around a median comfortably above 1.0x, essentially none of their funds land below
  #      break-even, so a narrow band and a positive centre hold at the same time.
  #
  # Note that a strategy's *realised* TVPI at the as-of date is a different thing from the
  # terminal figure set here, and will sit well below it for any cohort that is still mid-life.
  # Infrastructure is the clearest case: its 11-14 year lives mean its funds are only about
  # halfway through, so it reads near break-even at the as-of date while being centred at 1.50x
  # terminal. That is the J-curve, not the calibration.
  strategies:
    Buyout:
      weight: 0.28
      tvpi_log_mean: 0.588 # median 1.80x
      tvpi_log_sd: 0.34
      life_years_range: [10, 13]
    Venture:
      weight: 0.18
      tvpi_log_mean: 0.615 # median 1.85x
      tvpi_log_sd: 0.72 # widest by design
      life_years_range: [11, 14]
    Growth:
      weight: 0.14
      tvpi_log_mean: 0.560 # median 1.75x
      tvpi_log_sd: 0.45
      life_years_range: [10, 13]
    Private Credit:
      weight: 0.14
      tvpi_log_mean: 0.336 # median 1.40x
      tvpi_log_sd: 0.14 # narrowest by design
      life_years_range: [7, 10]
    Real Estate:
      weight: 0.10
      tvpi_log_mean: 0.438 # median 1.55x
      tvpi_log_sd: 0.28
      life_years_range: [9, 12]
    Infrastructure:
      weight: 0.10
      tvpi_log_mean: 0.405 # median 1.50x
      tvpi_log_sd: 0.16 # second narrowest by design
      life_years_range: [11, 14]
    Secondaries:
      weight: 0.06
      tvpi_log_mean: 0.372 # median 1.45x
      tvpi_log_sd: 0.18
      life_years_range: [7, 10]

investors:
  count: 12
  types: [Pension, Endowment, Insurance, Family Office, Sovereign Wealth]

commitments:
  funds_per_investor_range: [8, 20]
  # Commitment as a share of fund size. A 12-LP synthetic universe cannot fill a real fund, so
  # these shares deliberately do not sum to 1 across the investors in any one fund.
  fraction_of_fund_size_range: [0.01, 0.08]
  # Days after 1 January of the vintage year that the commitment is signed, which is why no cash
  # flow can precede it.
  date_lag_days_range: [0, 365]

cash_flows:
  call_period_years: 5
  calls_per_commitment_range: [5, 11]
  # Beta(a, b) over the call window. a < b skews draws early, which front-loads the calls.
  call_beta: [1.6, 2.4]
  distribution_start_year: 4
  distribution_end_year: 12
  distributions_per_commitment_range: [4, 12]
  # a > b skews draws late, which back-loads the distributions.
  distribution_beta: [2.4, 1.6]
  # Share of commitment ever drawn, counting management fees. Below 1.0 because almost no fund
  # calls every euro of every commitment, and because paid-in above commitment is only legitimate
  # against recallable distributions already received.
  terminal_paid_in_fraction_range: [0.80, 0.98]
  management_fee_rate: 0.02
  management_fee_years: 10
  recallable_share_range: [0.0, 0.15]

nav:
  initial_multiple: 0.95
  trough_multiple: 0.80
  trough_progress: 0.18
  quarterly_noise_sd: 0.025

market:
  fx:
    base_rate: 1.10
    annual_vol: 0.08
    mean_reversion: 0.004
  index:
    name: SYNTH_GLOBAL_EQUITY_TR
    start_level: 100.0
    annual_drift: 0.07
    annual_vol: 0.16
