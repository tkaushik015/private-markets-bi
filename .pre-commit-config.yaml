# Local gate that mirrors what PR CI enforces, so a failure shows up before the push
# rather than after. Install once with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # TMDL is indentation-significant and Power BI Desktop rewrites these files on save;
        # stripping whitespace here would fight the tool and produce noisy diffs.
        exclude: '\.tmdl$'
      - id: end-of-file-fixer
        exclude: '\.tmdl$'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # A local hook rather than the upstream sqlfluff repo. The dbt templater has to import dbt and
  # the duckdb adapter to compile each model, and it needs the lp_lens package importable for the
  # Python models to parse. pre-commit's isolated hook environment has none of that, so this runs
  # sqlfluff from the project environment instead.
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt templater)
        # One invocation over the models directory. Passing each file as an argument makes the
        # dbt templater open DuckDB once per file, and DuckDB refuses a second lock on the same
        # path. `sqlfluff lint warehouse/models` compiles the project once instead.
        entry: sqlfluff lint warehouse/models
        language: system
        pass_filenames: false
        files: ^warehouse/models/.*\.sql$
