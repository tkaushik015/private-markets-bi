name: CI

# The predecessor project had no pull_request trigger at all (docs/AUDIT.md section 4), so every
# check ran after the merge rather than before it. This runs on the PR.
on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it interrupted; there is no reason to pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only the dev extra. sqlfluff has no dbt project to compile against yet and the Snowflake
      # and app dependencies are not exercised by any test, so installing them would add minutes
      # of CI time to check nothing. Phase 5 widens this as the phases that need it land.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest
